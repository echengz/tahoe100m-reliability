[project]
name = "tahoe100m-reliability"
version = "0.1.0"
description = "Runs the Tahoe-100M reliability pipeline"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anndata>=0.13.4",
    "blitzgsea>=1.3.54",
    "datasets>=5.1.0",
    "duckdb>=2.0.0",
    "gseapy>=1.3.1",
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pubchempy>=1.0.5",
    "pyarrow>=26.0.0",
    "pycirclize>=1.10.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
tahoe100m-reliability = "tahoe100m_reliability.bin.entrypoint:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
